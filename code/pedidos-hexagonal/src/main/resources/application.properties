spring.application.name=pedidos-hexagonal

# H2 en memoria (demo). En producción: PostgreSQL + Testcontainers en los tests.
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# El esquema lo gobierna Flyway; Hibernate solo valida que las entidades encajan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
