spring.application.name=pedidos-legacy

# H2 en memoria (en "producción" era PostgreSQL)
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate crea el esquema y luego data.sql carga el catálogo de productos
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Pasarela de pagos (el servicio conoce la URL y la API key: defecto #8)
# Sin servidor en esa URL, confirmar devuelve 500 con el mensaje interno (defecto #7).
pagos.url=${PAGOS_URL:http://localhost:9090}
pagos.apiKey=${PAGOS_API_KEY:sk_test_legacy_123}

# SMTP: no hace falta servidor para arrancar. Si no hay, el envío falla
# y PedidoService se traga la excepción (log.error), como en el enunciado.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
